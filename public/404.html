<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ninkie's Bakes</title>
    <script>
      // GitHub Pages serves this file for unknown paths.
      // Redirect to the SPA root so client-side routing can take over.
      var pathSegmentsToKeep = 1; // /<repo>/
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
